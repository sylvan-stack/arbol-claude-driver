[project]
name = "arbol-claude-driver"
version = "1.0.0"
description = "Arbol 2 command-line driver for Claude"
requires-python = "==3.14.8"
dependencies = []

[dependency-groups]
dev = ["mypy==1.19.1", "ruff==0.15.4"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["src", "scripts"]
files = ["src/arbol_claude_driver", "tests", "scripts", "bin/entry.py"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
